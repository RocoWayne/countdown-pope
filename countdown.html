<!DOCTYPE html>
<!--
  Countdown Visita del Papa a la Argentina — pantalla para OBS
  VERSION: v1 (2026-09-02)
  Cómo editar la fecha objetivo: buscar la constante TARGET_DATE más abajo.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visita Papal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    Página de transmisión (OBS) — diseño único, siempre oscuro a propósito
    (gráfica de emisión, no un documento que deba seguir el tema del sistema).
  */
  :root {
    --ink: #f7f1e1;
    --ink-dim: #d9cfb2;
    --gold: #d9b25c;
    --gold-soft: #e8c766;
    --ground: #0b0806;
    --panel: rgba(22, 15, 8, 0.4);
    --panel-border: rgba(217, 178, 92, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ground);
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }

  /* Fondo con imágenes del Papa en slideshow */
  .bg-layer {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 2.5s ease-in-out;
    filter: saturate(0.9) brightness(0.55);
    z-index: 0;
  }
  .bg-layer.active { opacity: 1; }

  /* Oscurecido + viñeta para que el texto se lea bien */
  .overlay {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.75) 75%),
      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.25) 30%, rgba(0,0,0,0.25) 70%, rgba(0,0,0,0.65) 100%);
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink);
    padding: 2vh 4vw;
  }

  .eyebrow {
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 1.1vw;
    font-weight: 500;
    color: var(--gold-soft);
    margin-bottom: 1.4vh;
  }

  .title {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 4.2vw;
    font-weight: 600;
    text-shadow: 0 4px 24px rgba(0,0,0,0.8);
    line-height: 1.15;
    margin-bottom: 0.8vh;
    text-wrap: balance;
  }

  .subtitle {
    font-size: 1.2vw;
    font-weight: 400;
    color: var(--ink-dim);
    margin-bottom: 4vh;
    letter-spacing: 0.06em;
  }

  .countdown {
    display: flex;
    gap: 3vw;
    margin-bottom: 3vh;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 9vw;
  }

  .unit .value {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 7vw;
    font-weight: 700;
    line-height: 1;
    color: #fffdf6;
    text-shadow: 0 0 30px rgba(217,178,92,0.55), 0 4px 20px rgba(0,0,0,0.9);
    font-variant-numeric: tabular-nums;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 1.2vh 0.6vw;
    width: 100%;
    backdrop-filter: blur(4px);
  }

  .unit .label {
    margin-top: 1.2vh;
    font-size: 1vw;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold-soft);
  }

  .separator {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 6vw;
    font-weight: 700;
    color: var(--gold-soft);
    align-self: flex-start;
    margin-top: 0.6vh;
    opacity: 0.6;
  }

  .target-date {
    font-size: 1.05vw;
    font-weight: 400;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
  }

  .target-date strong {
    font-weight: 500;
    color: var(--ink);
  }

  .arrived {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 4.5vw;
    font-weight: 700;
    color: #fffdf6;
    text-shadow: 0 0 40px rgba(217,178,92,0.7);
  }

  .version-tag {
    position: fixed;
    bottom: 1.2vh;
    right: 1.6vw;
    z-index: 3;
    font-size: 0.75vw;
    font-weight: 400;
    color: rgba(247,241,225,0.35);
    letter-spacing: 0.1em;
  }

  @media (max-width: 900px) {
    .title { font-size: 6vw; }
    .subtitle { font-size: 2.6vw; }
    .unit .value { font-size: 12vw; }
    .unit .label { font-size: 2vw; }
    .separator { font-size: 10vw; }
    .target-date { font-size: 2.4vw; }
    .eyebrow { font-size: 2.4vw; }
  }
</style>
</head>
<body>

  <div id="bgContainer"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="eyebrow">Cuenta regresiva</div>
    <div class="title">La Visita del Papa León&nbsp;XIV a la&nbsp;Argentina</div>
    <div class="subtitle">Faltan…</div>

    <div class="countdown" id="countdown">
      <div class="unit">
        <div class="value" id="days">00</div>
        <div class="label">Días</div>
      </div>
      <div class="separator">:</div>
      <div class="unit">
        <div class="value" id="hours">00</div>
        <div class="label">Horas</div>
      </div>
      <div class="separator">:</div>
      <div class="unit">
        <div class="value" id="minutes">00</div>
        <div class="label">Minutos</div>
      </div>
      <div class="separator">:</div>
      <div class="unit">
        <div class="value" id="seconds">00</div>
        <div class="label">Segundos</div>
      </div>
    </div>

    <div class="target-date" id="targetDateLabel"></div>
  </div>

  <div class="version-tag">countdown-papa · v1</div>

  <script>
    // ==== CONFIGURACIÓN ====
    // Fecha y hora objetivo (zona horaria Argentina, Buenos Aires, UTC-3 fijo).
    // Editar acá cuando se confirme el horario exacto de la visita.
    const TARGET_DATE = new Date("2026-11-08T12:00:00-03:00");

    // Imágenes de fondo (Wikimedia Commons, licencia CC BY-SA 4.0 / dominio público,
    // uso libre con atribución: https://commons.wikimedia.org/wiki/Category:Pope_Leo_XIV)
    const BG_IMAGES = [
      "https://commons.wikimedia.org/wiki/Special:FilePath/Pope_Leo_XIV_on_the_loggia.jpg",
      "https://commons.wikimedia.org/wiki/Special:FilePath/Pope_Leo_XIV_2.jpg",
      "https://commons.wikimedia.org/wiki/Special:FilePath/Leo_XIV_(13_October_2025).jpg"
    ];
    const SLIDESHOW_INTERVAL_MS = 12000;
    // ========================

    const dateFormatter = new Intl.DateTimeFormat("es-AR", {
      day: "2-digit", month: "long", year: "numeric",
      hour: "2-digit", minute: "2-digit",
      timeZone: "America/Argentina/Buenos_Aires"
    });
    document.getElementById("targetDateLabel").innerHTML =
      "Llegada estimada: <strong>" + dateFormatter.format(TARGET_DATE) + " hs (ARG)</strong>";

    function pad(n) { return String(n).padStart(2, "0"); }

    function tick() {
      const now = new Date();
      let diff = TARGET_DATE.getTime() - now.getTime();

      if (diff <= 0) {
        document.getElementById("countdown").innerHTML =
          '<div class="arrived">¡El Papa está en Argentina! 🇦🇷</div>';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent = pad(days);
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);
    }

    tick();
    setInterval(tick, 1000);

    // Slideshow de fondo (solo se agregan las imágenes que efectivamente cargan,
    // así nunca se ve un ícono de imagen rota en OBS)
    const bgContainer = document.getElementById("bgContainer");
    let currentBg = 0;
    let layers = [];

    function startSlideshow() {
      layers = document.querySelectorAll(".bg-layer");
      if (layers.length === 0) return;
      layers[0].classList.add("active");
      if (layers.length > 1) {
        setInterval(() => {
          layers[currentBg].classList.remove("active");
          currentBg = (currentBg + 1) % layers.length;
          layers[currentBg].classList.add("active");
        }, SLIDESHOW_INTERVAL_MS);
      }
    }

    let pending = BG_IMAGES.length;
    BG_IMAGES.forEach((url) => {
      const probe = new Image();
      probe.onload = () => {
        const layer = document.createElement("div");
        layer.className = "bg-layer";
        layer.style.backgroundImage = "url('" + url + "')";
        bgContainer.appendChild(layer);
        pending--;
        if (pending === 0) startSlideshow();
      };
      probe.onerror = () => {
        pending--;
        if (pending === 0) startSlideshow();
      };
      probe.src = url;
    });
  </script>
</body>
</html>
