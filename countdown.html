<!DOCTYPE html>
<!--
  Countdown Visita del Papa a la Argentina — pantalla para OBS
  VERSION: v2.11 (2026-09-02) — estética adaptada al look and feel de Canal 26
  (fondo blanco, rojo de noticiero, negro, tipografía condensada).
  Las imágenes de fondo se leen de /images/manifest.json (regenerado
  automáticamente por un GitHub Action) — cualquier .jpg/.jpeg/.png en
  /images se usa, sin convención de nombre. Ver images/README.md.
  El zócalo de noticias (news.json, scripts/fetch_news.py) y el texto
  "Papa León XIV / Rumbo a la Argentina" sobre la foto están ocultos
  por ahora a pedido — el código queda intacto (ver .zocalo y
  .photo-caption en el CSS, y loadNewsTicker en el JS) para reactivarlos.
  La música de fondo se lee de /music/manifest.json (mismo mecanismo que
  las imágenes) y se reproduce siempre en orden aleatorio, sin repetir
  un tema hasta que suenen todos los demás. Ver music/README.md. El chip
  "now playing" está anclado arriba a la izquierda.
  Debajo de "Llegada estimada" hay una caja de trivia que rota un dato
  a la vez (fade cada 15s, sin repetir hasta agotar la lista), leyendo
  trivia.json (array plano de strings, máx. 240 caracteres cada uno) —
  se edita directo, sin Action.
  Cómo editar la fecha objetivo: buscar la constante TARGET_DATE más abajo.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visita Papal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Página de transmisión (OBS) — diseño único, siempre claro a propósito
    (gráfica de emisión estilo noticiero, no un documento que deba seguir
    el tema del sistema).
  */
  :root {
    --paper: #ffffff;
    --paper-dim: #f4f4f5;
    --ink: #14141a;
    --ink-dim: #5b5b63;
    --hair: #e3e3e6;
    --red: #e1261c;
    --red-dark: #b81d15;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
  }

  /* ===== Fondo: foto del Papa como panel lateral, no full-bleed ===== */
  .photo-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 42vw;
    height: 100%;
    overflow: hidden;
    background: var(--paper-dim);
  }

  .bg-layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center 20%;
    opacity: 0;
    transition: opacity 2.2s ease-in-out;
  }
  .bg-layer.active { opacity: 1; }

  .photo-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 9%);
    z-index: 2;
  }

  .photo-panel::after {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: var(--red);
    z-index: 3;
  }

  /* Oculto por ahora a pedido. El HTML se deja intacto (línea con
     class="photo-caption") — para reactivarlo, volver a "block". */
  .photo-caption {
    display: none;
    position: absolute;
    left: 3vw;
    bottom: 3vh;
    z-index: 4;
    color: #fff;
    font-family: 'Barlow Condensed', 'Inter', sans-serif;
    font-weight: 600;
    font-size: 1.1vw;
    letter-spacing: 0.04em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.85);
  }

  .photo-caption span {
    display: block;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.75vw;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #f2c9c6;
    margin-bottom: 0.4vh;
  }

  /* ===== Contenido central ===== */
  .content {
    position: relative;
    z-index: 4;
    height: 100%;
    width: 58vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 4vw 7vh 4vw;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.5vw;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.95vw;
    font-weight: 700;
    color: var(--red);
    margin-bottom: 1.6vh;
    font-family: 'Inter', sans-serif;
  }

  .eyebrow::before {
    content: "";
    width: 1.6vw;
    height: 3px;
    background: var(--red);
    display: inline-block;
  }

  .title {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 3.4vw;
    line-height: 1.02;
    color: var(--ink);
    margin-bottom: 1.6vh;
    text-wrap: balance;
  }

  .title em {
    font-style: normal;
    color: var(--red);
  }

  .subtitle {
    font-size: 1.05vw;
    font-weight: 400;
    color: var(--ink-dim);
    margin-bottom: 4.5vh;
    max-width: 34vw;
    line-height: 1.5;
  }

  .countdown {
    display: flex;
    gap: 1.4vw;
    margin-bottom: 3.2vh;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 7vw;
  }

  .unit .value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 5.6vw;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    background: var(--paper);
    border: 1px solid var(--hair);
    border-top: 4px solid var(--red);
    border-radius: 4px;
    padding: 1.4vh 0.4vw 1vh;
    width: 100%;
    box-shadow: 0 8px 24px rgba(20,20,26,0.08);
  }

  .unit .label {
    margin-top: 1vh;
    font-size: 0.8vw;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
  }

  .target-date {
    font-size: 0.95vw;
    font-weight: 500;
    color: var(--ink-dim);
    letter-spacing: 0.01em;
  }

  .target-date strong {
    font-weight: 700;
    color: var(--ink);
  }

  /* ===== Caja de trivia: un dato a la vez, rotando con fade ===== */
  .trivia-box {
    display: none;
    align-items: flex-start;
    gap: 0.8vw;
    margin-top: 2.4vh;
    padding: 1.3vh 1.2vw;
    max-width: 34vw;
    background: var(--paper);
    border: 1px solid var(--hair);
    border-left: 4px solid var(--red);
    border-radius: 4px;
    box-shadow: 0 6px 18px rgba(20,20,26,0.06);
  }

  .trivia-box.visible { display: flex; }

  .trivia-label {
    flex: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.85vw;
    letter-spacing: 0.08em;
    color: var(--red);
    padding-top: 0.1vh;
  }

  .trivia-text {
    font-size: 0.9vw;
    line-height: 1.45;
    color: var(--ink);
    font-weight: 400;
    opacity: 1;
    transition: opacity 0.5s ease;
  }

  .trivia-text.fading {
    opacity: 0;
  }

  .arrived {
    font-family: 'Barlow Condensed', sans-serif;
    text-transform: uppercase;
    font-size: 3.6vw;
    font-weight: 700;
    color: var(--red);
  }

  /* ===== Zócalo inferior estilo noticiero =====
     Oculto por ahora (no se usa todavía). Para reactivarlo, cambiar
     "display: none" de vuelta a "display: flex" acá abajo — el HTML y
     el JS del ticker se dejaron intactos, no hace falta tocar nada más. */
  .zocalo {
    position: fixed;
    left: 0; bottom: 0;
    width: 100%;
    height: 6.5vh;
    background: var(--ink);
    display: none;
    align-items: stretch;
    z-index: 6;
  }

  .zocalo-tag {
    background: var(--red);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 1.15vw;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    padding: 0 1.8vw;
    white-space: nowrap;
  }

  .zocalo-ticker {
    flex: 1;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .zocalo-ticker-track {
    display: inline-flex;
    white-space: nowrap;
    animation: scroll-left 26s linear infinite;
    color: #f4f4f5;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 1.05vw;
    letter-spacing: 0.01em;
  }

  .zocalo-ticker-track span {
    padding-right: 5vw;
  }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ===== Botón de activar audio (solo aparece si el navegador bloquea
     el autoplay con sonido) ===== */
  .audio-unlock {
    position: fixed;
    top: 1.6vh;
    right: 1.6vw;
    z-index: 8;
    display: none;
    align-items: center;
    gap: 0.5vw;
    padding: 0.7vh 1.1vw;
    border-radius: 999px;
    border: none;
    background: var(--red);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85vw;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(184,29,21,0.35);
  }

  .audio-unlock.visible { display: flex; }

  .now-playing {
    position: fixed;
    top: 1.6vh;
    left: 1.6vw;
    z-index: 7;
    display: none;
    align-items: center;
    gap: 0.5vw;
    padding: 0.6vh 1vw;
    border-radius: 999px;
    background: rgba(255,255,255,0.9);
    border: 1px solid var(--hair);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.75vw;
    color: var(--ink-dim);
    max-width: 22vw;
  }

  .now-playing.visible { display: flex; }

  .now-playing .dot {
    width: 0.5vw;
    height: 0.5vw;
    min-width: 7px;
    min-height: 7px;
    border-radius: 50%;
    background: var(--red);
    flex: none;
  }

  .now-playing .track-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  @media (max-width: 900px) {
    .content { width: 100%; padding: 6vh 6vw 12vh; }
    .photo-panel { width: 100%; opacity: 0.18; }
    .title { font-size: 8vw; }
    .subtitle { font-size: 3vw; max-width: 100%; }
    .unit .value { font-size: 13vw; }
    .unit .label { font-size: 2.2vw; }
    .zocalo-tag { font-size: 3vw; }
    .zocalo-ticker-track { font-size: 2.6vw; }
    .audio-unlock { font-size: 2.4vw; }
    .now-playing { font-size: 2.2vw; max-width: 60vw; }
    .trivia-box { max-width: 100%; }
    .trivia-label { font-size: 2.4vw; }
    .trivia-text { font-size: 2.6vw; }
  }
</style>
</head>
<body>

  <div class="photo-panel">
    <div id="bgContainer"></div>
    <div class="photo-caption"><span>Papa León XIV</span>Rumbo a la Argentina</div>
  </div>

  <div class="content">
    <div class="eyebrow">Papa León XIV</div>
    <div class="title">La visita del Papa a la <em>Argentina</em></div>
    <div class="subtitle">Cuenta regresiva en vivo para la llegada del pontífice al país, primera visita papal a la Argentina desde Juan Pablo II en 1987.</div>

    <div class="countdown" id="countdown">
      <div class="unit">
        <div class="value" id="days">00</div>
        <div class="label">Días</div>
      </div>
      <div class="unit">
        <div class="value" id="hours">00</div>
        <div class="label">Horas</div>
      </div>
      <div class="unit">
        <div class="value" id="minutes">00</div>
        <div class="label">Min</div>
      </div>
      <div class="unit">
        <div class="value" id="seconds">00</div>
        <div class="label">Seg</div>
      </div>
    </div>

    <div class="target-date" id="targetDateLabel"></div>

    <div class="trivia-box" id="triviaBox">
      <span class="trivia-label">Dato</span>
      <span class="trivia-text" id="triviaText"></span>
    </div>
  </div>

  <div class="zocalo">
    <div class="zocalo-tag">Última hora</div>
    <div class="zocalo-ticker">
      <div class="zocalo-ticker-track" id="tickerTrack"></div>
    </div>
  </div>

  <button class="audio-unlock" id="audioUnlock" type="button">🔊 Activar música</button>
  <div class="now-playing" id="nowPlaying"><span class="dot"></span><span class="track-name" id="trackName"></span></div>
  <audio id="player" preload="auto"></audio>

  <script>
    // ==== CONFIGURACIÓN ====
    // Fecha y hora objetivo (zona horaria Argentina, Buenos Aires, UTC-3 fijo).
    // Editar acá cuando se confirme el horario exacto de la visita.
    const TARGET_DATE = new Date("2026-11-08T12:00:00-03:00");

    // Imágenes de fondo: se leen directamente de la carpeta /images del
    // repositorio, sin ninguna regla de nombre. Un GitHub Action
    // (.github/workflows/update-image-manifest.yml) regenera
    // images/manifest.json automáticamente cada vez que se sube o borra
    // un .jpg/.jpeg/.png en /images. Esta página solo lee ese manifest.
    const IMAGE_FOLDER = "images/";
    const MANIFEST_URL = IMAGE_FOLDER + "manifest.json";
    const SLIDESHOW_INTERVAL_MS = 12000;
    // ========================

    const dateFormatter = new Intl.DateTimeFormat("es-AR", {
      day: "2-digit", month: "long", year: "numeric",
      hour: "2-digit", minute: "2-digit",
      timeZone: "America/Argentina/Buenos_Aires"
    });
    const targetDateText = dateFormatter.format(TARGET_DATE) + " hs (ARG)";
    document.getElementById("targetDateLabel").innerHTML =
      "Llegada estimada: <strong>" + targetDateText + "</strong>";

    // Zócalo: se arma con las últimas noticias de news.json (regenerado por
    // .github/workflows/update-news.yml a partir del tag de canal26.com).
    // Si no hay noticias (todavía no corrió el Action, o falló el fetch),
    // cae a un texto fijo para que el zócalo nunca quede vacío.
    const NEWS_URL = "news.json";
    const NEWS_REFRESH_MS = 5 * 60 * 1000;
    const FALLBACK_TICKER_TEXT =
      "VISITA PAPAL A LA ARGENTINA · Llegada estimada: " + targetDateText +
      " · Primera visita de un Papa al país desde 1987 · Seguí la cobertura en vivo";

    function renderTicker(text) {
      const track = document.getElementById("tickerTrack");
      track.textContent = "";
      // Se repite dos veces para que la animación de scroll-left sea continua.
      [text, text].forEach((t) => {
        const span = document.createElement("span");
        span.textContent = t;
        track.appendChild(span);
      });
    }

    async function loadNewsTicker() {
      try {
        const res = await fetch(NEWS_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("news.json no disponible");
        const items = await res.json();
        const titles = Array.isArray(items)
          ? items.map((it) => (it && it.title ? String(it.title).trim() : "")).filter(Boolean)
          : [];
        if (titles.length > 0) {
          renderTicker(titles.slice(0, 10).join("     ·     "));
          return;
        }
      } catch (err) {
        // Sin conexión, sin Action corrido todavía, o abierto como archivo
        // local: se usa el texto fijo de abajo.
      }
      renderTicker(FALLBACK_TICKER_TEXT);
    }

    // Zócalo oculto por ahora (ver .zocalo en el CSS) — se deja de pedir
    // news.json en loop para no gastar red de más. Para reactivar el
    // ticker, además de mostrar el CSS, descomentar estas dos líneas:
    // loadNewsTicker();
    // setInterval(loadNewsTicker, NEWS_REFRESH_MS);

    function pad(n) { return String(n).padStart(2, "0"); }

    function tick() {
      const now = new Date();
      let diff = TARGET_DATE.getTime() - now.getTime();

      if (diff <= 0) {
        document.getElementById("countdown").innerHTML =
          '<div class="arrived">¡El Papa está en Argentina! 🇦🇷</div>';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent = pad(days);
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);
    }

    tick();
    setInterval(tick, 1000);

    // Slideshow de fondo: lee la lista de archivos desde manifest.json
    // (generado automáticamente) y solo agrega las imágenes que
    // efectivamente cargan, así nunca se ve un ícono de imagen rota en OBS.
    const bgContainer = document.getElementById("bgContainer");
    let currentBg = 0;

    function probeImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(url);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    async function loadManifest() {
      try {
        const res = await fetch(MANIFEST_URL, { cache: "no-store" });
        if (!res.ok) return [];
        const files = await res.json();
        if (!Array.isArray(files)) return [];
        return files.map((name) => IMAGE_FOLDER + name);
      } catch (err) {
        // Sin servidor (ej. abierto como archivo local) fetch() puede fallar
        // por CORS; el panel simplemente queda liso, sin romper la página.
        return [];
      }
    }

    function startSlideshow(urls) {
      urls.forEach((url) => {
        const layer = document.createElement("div");
        layer.className = "bg-layer";
        layer.style.backgroundImage = "url('" + url + "')";
        bgContainer.appendChild(layer);
      });
      const layers = document.querySelectorAll(".bg-layer");
      if (layers.length === 0) return;
      layers[0].classList.add("active");
      if (layers.length > 1) {
        setInterval(() => {
          layers[currentBg].classList.remove("active");
          currentBg = (currentBg + 1) % layers.length;
          layers[currentBg].classList.add("active");
        }, SLIDESHOW_INTERVAL_MS);
      }
    }

    (async function loadBackgroundImages() {
      const candidates = await loadManifest();
      const found = [];
      for (const url of candidates) {
        const ok = await probeImage(url);
        if (ok) found.push(ok);
      }
      startSlideshow(found);
    })();

    // ===== Música de fondo: siempre en shuffle, sin repetir tema =====
    // Lee /music/manifest.json (regenerado automáticamente por
    // .github/workflows/update-music-manifest.yml). Se arma un orden al
    // azar de toda la playlist y se reproduce esa cola completa antes de
    // volver a barajar, así no hay repeticiones hasta agotar los temas;
    // al rebarajar se evita que el primero de la nueva vuelta sea igual
    // al último de la anterior, para que tampoco se repita en el borde.
    const MUSIC_FOLDER = "music/";
    const MUSIC_MANIFEST_URL = MUSIC_FOLDER + "manifest.json";

    const player = document.getElementById("player");
    const audioUnlockBtn = document.getElementById("audioUnlock");
    const nowPlayingEl = document.getElementById("nowPlaying");
    const trackNameEl = document.getElementById("trackName");

    let playlist = [];
    let playOrder = [];
    let orderIndex = 0;

    function trackDisplayName(filename) {
      return filename
        .replace(/\.[^.]+$/, "")
        .replace(/[_-]+/g, " ")
        .trim();
    }

    function showNowPlaying(filename) {
      trackNameEl.textContent = "♪ " + trackDisplayName(filename);
      nowPlayingEl.classList.add("visible");
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildPlayOrder(avoidFirst) {
      const order = shuffle(playlist);
      if (order.length > 1 && order[0] === avoidFirst) {
        [order[0], order[1]] = [order[1], order[0]];
      }
      return order;
    }

    function playCurrent() {
      if (playOrder.length === 0) return;
      const file = playOrder[orderIndex];
      player.src = MUSIC_FOLDER + file;
      showNowPlaying(file);
      const playPromise = player.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(() => {
          // Autoplay con sonido bloqueado por el navegador: se necesita un
          // click. Se reintenta apenas el usuario toque el botón.
          audioUnlockBtn.classList.add("visible");
        });
      }
    }

    function playNextTrack() {
      if (playlist.length === 0) return;
      orderIndex++;
      if (orderIndex >= playOrder.length) {
        const lastPlayed = playOrder[playOrder.length - 1];
        playOrder = buildPlayOrder(lastPlayed);
        orderIndex = 0;
      }
      playCurrent();
    }

    player.addEventListener("ended", playNextTrack);
    player.addEventListener("error", () => {
      // Archivo corrupto o formato no soportado: lo salta en vez de
      // trabar la playlist.
      if (playlist.length > 1) playNextTrack();
    });

    audioUnlockBtn.addEventListener("click", () => {
      audioUnlockBtn.classList.remove("visible");
      player.muted = false;
      player.play().catch(() => {});
    });

    (async function loadMusicPlaylist() {
      try {
        const res = await fetch(MUSIC_MANIFEST_URL, { cache: "no-store" });
        if (!res.ok) return;
        const files = await res.json();
        if (!Array.isArray(files) || files.length === 0) return;
        playlist = files;
        playOrder = buildPlayOrder(null);
        orderIndex = 0;
        playCurrent();
      } catch (err) {
        // Sin música configurada o sin servidor (file://): la página
        // sigue funcionando igual, en silencio.
      }
    })();

    // ===== Caja de trivia: un dato a la vez, rotando sin repetir =====
    // Lee trivia.json (array plano de strings, hasta 240 caracteres cada
    // uno) y muestra uno por vez con fade, cambiando cada TRIVIA_INTERVAL_MS.
    // Editás trivia.json directamente y hacés push — no requiere Action.
    const TRIVIA_URL = "trivia.json";
    const TRIVIA_INTERVAL_MS = 15000;
    const TRIVIA_FADE_MS = 500;

    const triviaBox = document.getElementById("triviaBox");
    const triviaTextEl = document.getElementById("triviaText");

    let triviaItems = [];
    let triviaOrder = [];
    let triviaOrderIndex = 0;

    function showTrivia(text) {
      triviaTextEl.classList.add("fading");
      setTimeout(() => {
        triviaTextEl.textContent = text;
        triviaTextEl.classList.remove("fading");
      }, TRIVIA_FADE_MS);
    }

    function nextTrivia() {
      if (triviaItems.length === 0) return;
      triviaOrderIndex++;
      if (triviaOrderIndex >= triviaOrder.length) {
        const lastShown = triviaOrder[triviaOrder.length - 1];
        triviaOrder = buildTriviaOrder(lastShown);
        triviaOrderIndex = 0;
      }
      showTrivia(triviaOrder[triviaOrderIndex]);
    }

    function buildTriviaOrder(avoidFirst) {
      const order = shuffle(triviaItems);
      if (order.length > 1 && order[0] === avoidFirst) {
        [order[0], order[1]] = [order[1], order[0]];
      }
      return order;
    }

    (async function loadTrivia() {
      try {
        const res = await fetch(TRIVIA_URL, { cache: "no-store" });
        if (!res.ok) return;
        const items = await res.json();
        if (!Array.isArray(items)) return;
        triviaItems = items
          .map((t) => (typeof t === "string" ? t.trim() : ""))
          .filter((t) => t.length > 0 && t.length <= 240);
        if (triviaItems.length === 0) return;
        triviaOrder = buildTriviaOrder(null);
        triviaOrderIndex = 0;
        triviaTextEl.textContent = triviaOrder[0];
        triviaBox.classList.add("visible");
        if (triviaItems.length > 1) {
          setInterval(nextTrivia, TRIVIA_INTERVAL_MS);
        }
      } catch (err) {
        // Sin trivia.json o sin servidor (file://): la caja simplemente
        // no se muestra.
      }
    })();
  </script>
</body>
</html>
